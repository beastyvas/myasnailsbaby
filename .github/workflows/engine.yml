name: Hourly automations

# Vercel's Hobby plan allows a cron to fire once per day, but this job needs
# to run hourly: day-of reminders go out 2–4h before an appointment and
# review requests 2–4h after one ends, so a daily run would miss nearly all
# of them. GitHub Actions runs the same endpoint hourly for free. The
# endpoint is idempotent (guarded by sms_log), so the daily Vercel cron
# staying on as a backstop is harmless.
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: # lets you trigger a run by hand to test

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger automations
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          # Not configured yet is a different thing from broken. Failing here
          # would email on every run, hourly, forever — which trains you to
          # ignore exactly the alert that matters once it IS configured.
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::notice::Skipping — set the SITE_URL and CRON_SECRET secrets"
            echo "  Settings → Secrets and variables → Actions → New repository secret"
            echo "    SITE_URL     https://www.myasnailsbaby.com"
            echo "    CRON_SECRET  same value as the Vercel environment variable"
            exit 0
          fi

          BASE="${SITE_URL%/}"                    # tolerate a trailing slash
          URL="$BASE/api/cron/engine"

          # Resolve redirects with an UNAUTHENTICATED probe first. Two of them
          # are likely — a trailing slash giving //api/..., and apex→www — and
          # curl deliberately drops the Authorization header across hosts, so
          # -L alone would turn a 308 into a 401. The engine answers 401 here;
          # all we want back is the final URL. This also means the secret is
          # only ever sent to a host we've already confirmed.
          FINAL=$(curl -sS -o /dev/null -w '%{url_effective}' -L --max-time 30 "$URL" || echo "$URL")
          if [ "$FINAL" != "$URL" ]; then
            echo "::notice::$URL redirects to $FINAL — set the SITE_URL secret to ${FINAL%/api/cron/engine} to skip this hop"
          fi

          code=$(curl -sS -o /tmp/body.txt -w '%{http_code}' --max-time 60 \
            -H "Authorization: Bearer $CRON_SECRET" "$FINAL")
          echo "HTTP $code  ($FINAL)"
          cat /tmp/body.txt
          echo

          # Configured but erroring genuinely means texts stopped going out.
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
            echo "::error::Automations returned HTTP $code — reminders, review requests and rebooking nudges are NOT sending."
            echo "  401 → the CRON_SECRET secret here and the one in Vercel don't match"
            echo "  404/000 → SITE_URL is wrong, or the deploy isn't live yet"
            echo "  500 → CRON_SECRET isn't set in Vercel at all"
            exit 1
          fi
