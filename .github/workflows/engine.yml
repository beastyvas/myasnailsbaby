name: Hourly automations

# Vercel's Hobby plan allows a cron to fire once per day, but this job needs
# to run hourly: day-of reminders go out 2–4h before an appointment and
# review requests 2–4h after one ends, so a daily run would miss nearly all
# of them. GitHub Actions runs the same endpoint hourly for free. The
# endpoint is idempotent (guarded by sms_log), so the daily Vercel cron
# staying on as a backstop is harmless.
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: # lets you trigger a run by hand to test

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger automations
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          # Not configured yet is a different thing from broken. Failing here
          # would email on every run, hourly, forever — which trains you to
          # ignore exactly the alert that matters once it IS configured.
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::notice::Skipping — set the SITE_URL and CRON_SECRET secrets"
            echo "  Settings → Secrets and variables → Actions → New repository secret"
            echo "    SITE_URL     https://www.myasnailsbaby.com"
            echo "    CRON_SECRET  same value as the Vercel environment variable"
            exit 0
          fi

          BASE="${SITE_URL%/}"                    # tolerate a trailing slash
          URL="$BASE/api/cron/engine"

          # Resolve redirects with an UNAUTHENTICATED probe first. Two of them
          # are likely — a trailing slash giving //api/..., and apex→www — and
          # curl deliberately drops the Authorization header across hosts, so
          # -L alone would turn a 308 into a 401. The engine answers 401 here;
          # all we want back is the final URL. This also means the secret is
          # only ever sent to a host we've already confirmed.
          FINAL=$(curl -sS -o /dev/null -w '%{url_effective}' -L --max-time 30 "$URL" || echo "$URL")
          if [ "$FINAL" != "$URL" ]; then
            echo "::notice::$URL redirects to $FINAL — set the SITE_URL secret to ${FINAL%/api/cron/engine} to skip this hop"
          fi

          code=$(curl -sS -o /tmp/body.txt -w '%{http_code}' --max-time 60 \
            -H "Authorization: Bearer $CRON_SECRET" "$FINAL")
          echo "HTTP $code  ($FINAL)"
          cat /tmp/body.txt
          echo

          # Configured but erroring genuinely means texts stopped going out.
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
            echo "::error::Automations returned HTTP $code — reminders, review requests and rebooking nudges are NOT sending."
            echo "  401 → the CRON_SECRET secret here and the one in Vercel don't match"
            echo "  404/000 → SITE_URL is wrong, or the deploy isn't live yet"
            echo "  500 → CRON_SECRET isn't set in Vercel at all"
            exit 1
          fi

          # HTTP 200 is not the same as "it worked". The engine answers 200
          # with a populated `failures` array when Textbelt rejected sends —
          # so a run where every single text failed used to be a green tick
          # and no email. That is the failure this block exists to catch.
          #
          # This is deliberately the alerting channel rather than a text
          # message: the likeliest cause is Textbelt being out of credits, and
          # alerting about broken texting by sending a text fails at exactly
          # the moment it's needed.
          fails=$(jq -r '(.failures // []) | length' /tmp/body.txt 2>/dev/null || echo 0)
          credits=$(jq -r '.creditsLeft // "unknown"' /tmp/body.txt 2>/dev/null || echo unknown)
          # NOT `// "unknown"` — jq's alternative operator treats `false` as
          # absent, so that would silently convert the exact failure we're
          # looking for into "unknown" and never alert. Test caught it.
          keyed=$(jq -r 'if .textbeltConfigured == null then "unknown" else (.textbeltConfigured|tostring) end' /tmp/body.txt 2>/dev/null || echo unknown)
          echo "failed sends: $fails   credits left: $credits   key visible: $keyed"

          # The most actionable failure there is, and the one that produced
          # four texts the dashboard counted and nobody received. Checked
          # first because nothing else matters if the key isn't there.
          if [ "$keyed" = "false" ]; then
            echo "::error::No Textbelt key visible to the running app — NOTHING is sending, including appointment reminders."
            echo "  In Vercel → Settings → Environment Variables, check:"
            echo "    · a variable named TEXTBELT_KEY or TEXTBELT_API_KEY exists (either works)"
            echo "    · the Production scope is ticked, not just Preview/Development"
            echo "    · the value isn't empty"
            echo "  Then REDEPLOY — variables only reach builds created after they're added."
            exit 1
          fi

          # A negative balance isn't a balance. Textbelt answers the quota
          # endpoint with a negative number when it doesn't recognise the key,
          # which is a different problem from having spent your credits and
          # wants a different fix — so don't report them as the same thing.
          if [ "$credits" != "unknown" ] && [ "$credits" -lt 0 ] 2>/dev/null; then
            echo "::error::Textbelt does not recognise the key (quota came back $credits). The key is present but wrong or expired."
            echo "  Compare the value in Vercel against the funded key at https://textbelt.com/quota/<key>"
            exit 1
          fi

          if [ "$fails" -gt 0 ] 2>/dev/null; then
            echo "::error::$fails message(s) failed to send despite HTTP 200. Most likely Textbelt is out of credits or the key is invalid."
            echo "  Check the balance: https://textbelt.com/quota/<your key>"
            exit 1
          fi

          # Warn early enough to act. "unknown" means the key isn't set or the
          # quota check itself failed — different from empty, so don't alarm.
          if [ "$credits" != "unknown" ] && [ "$credits" -lt 15 ] 2>/dev/null; then
            echo "::error::Only $credits Textbelt credits left — texts will stop soon. Top up the key."
            exit 1
          fi
