name: Hourly automations

# Vercel's Hobby plan allows a cron to fire once per day, but this job needs
# to run hourly: day-of reminders go out 2–4h before an appointment and
# review requests 2–4h after one ends, so a daily run would miss nearly all
# of them. GitHub Actions runs the same endpoint hourly for free. The
# endpoint is idempotent (guarded by sms_log), so the daily Vercel cron
# staying on as a backstop is harmless.
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: # lets you trigger a run by hand to test

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger automations
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ]; then
            echo "SITE_URL secret is not set — add it in Settings → Secrets → Actions"
            exit 1
          fi
          code=$(curl -sS -o /tmp/body.txt -w "%{http_code}" \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$SITE_URL/api/cron/engine")
          echo "HTTP $code"
          cat /tmp/body.txt
          # a non-2xx means the automations silently stopped — fail loudly
          [ "$code" -ge 200 ] && [ "$code" -lt 300 ]
